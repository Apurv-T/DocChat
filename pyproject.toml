[project]
name = "docchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "certifi>=2026.11.20",
    "fastapi>=0.165.0",
    "firecrawl-py>=4.57.0",
    "isort>=9.0.2",
    "jinja2>=3.1.6",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.5",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchainhub>=0.1.21",
    "langsmith>=0.16.0",
    "nltk>=3.10.4",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "streamlit-chat>=0.1.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.37",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[project.scripts]
docchat = "docchat:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
